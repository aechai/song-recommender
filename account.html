<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — Song Recommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0d12;
      --bg-elevated: #14151c;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8e9ed;
      --muted: #8b8f9a;
      --accent: #7c5cff;
      --accent-dim: rgba(124, 92, 255, 0.15);
      --danger: #f87171;
      --radius: 14px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(124, 92, 255, 0.18), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(56, 189, 248, 0.1), transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      border: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .nav-link:hover {
      color: var(--text);
      border-color: var(--border);
      background: var(--bg-elevated);
    }

    .nav-link[aria-current="page"] {
      color: var(--text);
      border-color: rgba(124, 92, 255, 0.35);
      background: var(--accent-dim);
    }

    .nav-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      opacity: 0.9;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
    }

    .sub {
      color: var(--muted);
      font-size: 1rem;
      max-width: 60ch;
      margin: 0 0 1.5rem;
    }

    .panel {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      transition: border-color 0.15s, transform 0.15s;
    }

    .card:hover {
      border-color: rgba(124, 92, 255, 0.35);
      transform: translateY(-2px);
    }

    .svc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .svc-name {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pill.on {
      color: var(--text);
      border-color: rgba(124, 92, 255, 0.45);
      background: var(--accent-dim);
    }

    .svc-desc {
      margin: 0;
      font-size: 0.9rem;
      color: #a4a8b5;
      line-height: 1.45;
    }

    .svc-meta {
      margin: 0.25rem 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.75rem;
    }

    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #5b8cff);
      color: #fff;
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.26);
      transition: transform 0.12s, filter 0.12s, opacity 0.12s;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    button.btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.btn-secondary:hover:not(:disabled) {
      border-color: rgba(124, 92, 255, 0.45);
      background: var(--accent-dim);
    }

    button.btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.45);
      box-shadow: none;
    }

    button.btn-danger:hover:not(:disabled) {
      background: rgba(248, 113, 113, 0.1);
    }

    .status {
      font-size: 0.9rem;
      min-height: 1.4em;
      color: var(--muted);
      margin: 0.75rem 0 0;
    }

    .status.error { color: var(--danger); }

    @media (prefers-reduced-motion: reduce) {
      button,
      .card,
      .nav-link { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav" aria-label="Site">
      <a href="/" class="nav-link">Recommend songs</a>
      <a href="/favorites" class="nav-link">Favorite tracks <span class="nav-count" id="favoritesNavCount">0</span></a>
      <a href="/playlists" class="nav-link">Saved playlists <span class="nav-count" id="savedPlaylistsNavCount">0</span></a>
      <a href="/account" class="nav-link" aria-current="page">Account</a>
    </nav>

    <header>
      <h1>Account</h1>
      <p class="sub">
        Link streaming services so this app can open songs in your accounts and (later) export playlists.
        Spotify and Google (for YouTube/YouTube Music) use real OAuth now.
      </p>
    </header>

    <section class="panel" aria-label="Linked services">
      <div class="grid" id="servicesGrid"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </div>

  <script>
    const FAVORITES_STORAGE_KEY = "songRecommenderFavorites";
    const PLAYLISTS_STORAGE_KEY = "songRecommenderSavedPlaylists";
    const services = [
      {
        id: "spotify",
        name: "Spotify",
        desc: "Links via Spotify OAuth. Used for opening tracks and future playlist export.",
      },
      {
        id: "google",
        name: "YouTube Music (Google)",
        desc: "Links your Google account (YouTube scope). This represents YouTube/YouTube Music access.",
      },
      {
        id: "apple_music",
        name: "Apple Music",
        desc: "Not implemented here (Apple Music requires MusicKit + developer token).",
      },
    ];

    function loadFavoritesLength() {
      try {
        const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
        if (!raw) return 0;
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr.length : 0;
      } catch {
        return 0;
      }
    }

    function loadSavedPlaylistsLength() {
      try {
        const raw = localStorage.getItem(PLAYLISTS_STORAGE_KEY);
        if (!raw) return 0;
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr.length : 0;
      } catch {
        return 0;
      }
    }

    function updateNavCounts() {
      const favNav = document.getElementById("favoritesNavCount");
      if (favNav) favNav.textContent = String(loadFavoritesLength());
      const plNav = document.getElementById("savedPlaylistsNavCount");
      if (plNav) plNav.textContent = String(loadSavedPlaylistsLength());
    }

    async function fetchAuthStatus() {
      const res = await fetch("/api/auth/status", { headers: { "Accept": "application/json" } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = typeof data.detail === "string" ? data.detail : "Could not load account status.";
        throw new Error(detail);
      }
      return data || {};
    }

    async function postJson(url) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: "{}",
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = typeof data.detail === "string" ? data.detail : "Request failed.";
        throw new Error(detail);
      }
      return data;
    }

    function setStatus(msg, isError) {
      const statusEl = document.getElementById("status");
      if (!statusEl) return;
      statusEl.textContent = msg || "";
      statusEl.classList.toggle("error", Boolean(isError));
    }

    function metaForService(svc, status) {
      if (!status || !status.linked) return "";
      if (svc.id === "spotify") {
        const dn = String(status.display_name || "").trim();
        const sid = String(status.id || "").trim();
        return dn ? `as ${dn}${sid ? ` · id ${sid}` : ""}` : (sid ? `id ${sid}` : "linked");
      }
      if (svc.id === "google") {
        const email = String(status.email || "").trim();
        const name = String(status.name || "").trim();
        if (name && email) return `${name} · ${email}`;
        return name || email || "linked";
      }
      return "linked";
    }

    async function render() {
      const grid = document.getElementById("servicesGrid");
      if (!grid) return;
      grid.innerHTML = "";

      let linked = {};
      try {
        linked = await fetchAuthStatus();
      } catch (e) {
        setStatus(e.message || "Could not load account status.", true);
      }

      services.forEach((svc) => {
        const state = linked[svc.id] || null;
        const isLinked = Boolean(state && state.linked);
        const canOAuth = svc.id === "spotify" || svc.id === "google";

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="svc-top">
            <h2 class="svc-name"></h2>
            <span class="pill"></span>
          </div>
          <p class="svc-desc"></p>
          <p class="svc-meta" id="meta-${svc.id}"></p>
          <div class="row">
            <button type="button" class="btn-link" id="btnLink-${svc.id}"></button>
            <button type="button" class="btn-danger" id="btnUnlink-${svc.id}">Unlink</button>
          </div>
        `;

        card.querySelector(".svc-name").textContent = svc.name;
        card.querySelector(".svc-desc").textContent = svc.desc;

        const pill = card.querySelector(".pill");
        pill.textContent = isLinked ? "LINKED" : "NOT LINKED";
        pill.classList.toggle("on", isLinked);

        const meta = card.querySelector(`#meta-${svc.id}`);
        meta.textContent = metaForService(svc, state);

        const btnLink = card.querySelector(`#btnLink-${svc.id}`);
        btnLink.textContent = isLinked ? "Re-link" : "Link";
        btnLink.disabled = !canOAuth;
        btnLink.addEventListener("click", () => {
          if (!canOAuth) return;
          if (svc.id === "spotify") window.location.href = "/auth/spotify/login";
          if (svc.id === "google") window.location.href = "/auth/google/login";
        });

        const btnUnlink = card.querySelector(`#btnUnlink-${svc.id}`);
        btnUnlink.disabled = !isLinked;
        btnUnlink.addEventListener("click", async () => {
          if (!isLinked) return;
          const ok = window.confirm(`Unlink ${svc.name}?`);
          if (!ok) return;
          try {
            if (svc.id === "spotify") await postJson("/auth/spotify/logout");
            if (svc.id === "google") await postJson("/auth/google/logout");
            setStatus(`${svc.name} unlinked.`, false);
            await render();
          } catch (e) {
            setStatus(e.message || "Could not unlink.", true);
          }
        });

        grid.appendChild(card);
      });
    }

    updateNavCounts();
    render();

    window.addEventListener("storage", (e) => {
      if (e.key === FAVORITES_STORAGE_KEY || e.key === PLAYLISTS_STORAGE_KEY) {
        updateNavCounts();
      }
    });
  </script>
</body>
</html>
