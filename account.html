<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — Song Recommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff5f7;
      --bg-elevated: rgba(255, 255, 255, 0.42);
      --border: rgba(255, 255, 255, 0.68);
      --text: #4c3b44;
      --muted: #8f7784;
      --accent: #c79b6b;
      --accent-soft: #d8b89b;
      --accent-dim: rgba(199, 155, 107, 0.2);
      --danger: #d47386;
      --radius: 24px;
      --shadow: 0 22px 42px rgba(181, 139, 158, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Montserrat", system-ui, sans-serif;
      background:
        radial-gradient(1000px 700px at -8% -12%, #fce4ec 0%, rgba(252, 228, 236, 0.15) 62%, transparent 100%),
        radial-gradient(920px 620px at 108% -4%, #f3e5f5 0%, rgba(243, 229, 245, 0.14) 60%, transparent 100%),
        radial-gradient(900px 500px at 50% 112%, #fff5f7 0%, rgba(255, 245, 247, 0.8) 58%, transparent 100%),
        linear-gradient(145deg, #fff8f3 0%, #fff5f7 45%, #f9eef7 100%);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    header { margin-bottom: 2rem; }
    .header-top { display: flex; justify-content: flex-end; margin-bottom: 0.9rem; }
    .lang-toggle { display: inline-flex; gap: 0.25rem; background: rgba(255, 255, 255, 0.48); border: 1px solid rgba(255, 255, 255, 0.72); border-radius: 999px; padding: 0.22rem; box-shadow: 0 10px 20px rgba(181, 139, 158, 0.14); backdrop-filter: blur(10px); }
    .lang-btn { appearance: none; border: 0; background: transparent; color: var(--muted); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; padding: 0.32rem 0.65rem; border-radius: 999px; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.is-active { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-soft)); box-shadow: 0 8px 14px rgba(199, 155, 107, 0.35); }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      border: 1px solid transparent;
      transition: color 0.18s, border-color 0.18s, background 0.18s, transform 0.18s;
    }

    .nav-link:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.46);
      transform: translateY(-1px);
    }

    .nav-link[aria-current="page"] {
      color: var(--text);
      border-color: rgba(199, 155, 107, 0.38);
      background: var(--accent-dim);
    }

    .nav-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      opacity: 0.9;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0 0 0.5rem;
      color: #6d4a58;
      text-shadow: 0 0 16px rgba(231, 185, 202, 0.45);
    }

    .sub {
      color: var(--muted);
      font-size: 1rem;
      margin: 0;
    }

    .panel {
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      backdrop-filter: blur(15px);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 0.75rem;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: var(--accent-dim);
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 0.65rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.16s, background 0.16s, border-color 0.16s, box-shadow 0.16s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(199, 155, 107, 0.24);
      border-color: rgba(199, 155, 107, 0.52);
      box-shadow: 0 10px 18px rgba(199, 155, 107, 0.24);
    }

    .btn-secondary {
      border-color: rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.45);
      font-weight: 650;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.58);
      border-color: rgba(199, 155, 107, 0.36);
    }

    .btn-danger {
      border: 1px solid rgba(212, 115, 134, 0.45);
      background: rgba(212, 115, 134, 0.12);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: rgba(212, 115, 134, 0.18);
      border-color: rgba(212, 115, 134, 0.6);
    }

    .status {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0.75rem 0 0;
    }

    .status strong { color: var(--text); }
    .status.error { color: var(--danger); }

    .note {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-link,
      .btn {
        transition: none;
      }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav" aria-label="Site">
      <a href="/" class="nav-link" data-i18n="nav.recommend">Recommend songs</a>
      <a href="/favorites" class="nav-link" data-i18n="nav.saved">Saved</a>
      <a href="/personality-quiz" class="nav-link" data-i18n="nav.quiz">Personality quiz</a>
      <a href="/account" class="nav-link" aria-current="page" data-i18n="nav.account">Account</a>
    </nav>

    <header>
      <div class="header-top">
        <div class="lang-toggle" role="group" aria-label="Language selector">
          <button type="button" class="lang-btn is-active" id="langEn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" id="langEs" data-lang="es">ES</button>
        </div>
      </div>
      <h1 data-i18n="header.title">Account</h1>
      <p class="sub" data-i18n="header.sub">Link your Google account to export playlists to YouTube.</p>
    </header>

    <section class="panel" aria-label="Google account linking">
      <p class="status" id="linkStatus" role="status" aria-live="polite" data-i18n="status.checking">Checking link status…</p>
      <div class="row">
        <button type="button" class="btn" id="linkBtn" data-i18n="buttons.link">Link Google (YouTube)</button>
        <button type="button" class="btn btn-danger" id="unlinkBtn" hidden data-i18n="buttons.unlink">Unlink</button>
        <button type="button" class="btn btn-secondary" id="refreshBtn" data-i18n="buttons.refresh">Refresh</button>
      </div>
      <p class="note" data-i18n="note.session">
        Linking is stored only in this server process (in-memory). Restarting the server will require linking again.
      </p>
    </section>
  </div>

  <script>
    const FAVORITES_STORAGE_KEY = "songRecommenderFavorites";
    const PLAYLISTS_STORAGE_KEY = "songRecommenderSavedPlaylists";
    const LANGUAGE_STORAGE_KEY = "songRecommenderLanguage";
    let currentLanguage = "en";
    const translations = {
      en: {
        "nav.recommend": "Recommend songs", "nav.saved": "Saved", "nav.quiz": "Personality quiz", "nav.account": "Account",
        "header.title": "Account", "header.sub": "Link your Google account to export playlists to YouTube.",
        "status.checking": "Checking link status…", "status.couldNotLoad": "Could not load status.", "status.linked": "Status: linked ✔", "status.notLinked": "Status: not linked",
        "status.networkError": "Network error: {{error}}", "status.unlinking": "Unlinking…", "status.unlinkFailed": "Unlink failed.",
        "buttons.link": "Link Google (YouTube)", "buttons.unlink": "Unlink", "buttons.refresh": "Refresh",
        "note.session": "Linking is stored only in this server process (in-memory). Restarting the server will require linking again.",
        "confirm.unlink": "Unlink your Google account from this session?",
      },
      es: {
        "nav.recommend": "Recomendar canciones", "nav.saved": "Guardadas", "nav.quiz": "Quiz de personalidad", "nav.account": "Cuenta",
        "header.title": "Cuenta", "header.sub": "Vincula tu cuenta de Google para exportar playlists a YouTube.",
        "status.checking": "Comprobando estado de vinculación…", "status.couldNotLoad": "No se pudo cargar el estado.", "status.linked": "Estado: vinculada ✔", "status.notLinked": "Estado: no vinculada",
        "status.networkError": "Error de red: {{error}}", "status.unlinking": "Desvinculando…", "status.unlinkFailed": "La desvinculación falló.",
        "buttons.link": "Vincular Google (YouTube)", "buttons.unlink": "Desvincular", "buttons.refresh": "Actualizar",
        "note.session": "La vinculación se guarda solo en este proceso del servidor (en memoria). Si reinicias el servidor, tendrás que vincular de nuevo.",
        "confirm.unlink": "¿Desvincular tu cuenta de Google de esta sesión?",
      },
    };
    function t(key, vars = {}) {
      const dict = translations[currentLanguage] || translations.en;
      const fallback = translations.en[key] || key;
      const template = dict[key] || fallback;
      return String(template).replace(/\{\{(\w+)\}\}/g, (_, n) => String(vars[n] ?? ""));
    }
    function switchLanguage(lang) {
      const next = lang === "es" ? "es" : "en";
      currentLanguage = next;
      localStorage.setItem(LANGUAGE_STORAGE_KEY, next);
      document.documentElement.lang = next;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (key) el.textContent = t(key);
      });
      document.getElementById("langEn")?.classList.toggle("is-active", next === "en");
      document.getElementById("langEs")?.classList.toggle("is-active", next === "es");
    }

    function loadFavoritesLength() {
      try {
        const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
        if (!raw) return 0;
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr.length : 0;
      } catch {
        return 0;
      }
    }

    function loadSavedPlaylistsLength() {
      try {
        const raw = localStorage.getItem(PLAYLISTS_STORAGE_KEY);
        if (!raw) return 0;
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr.length : 0;
      } catch {
        return 0;
      }
    }

    function updateNavCounts() {
      const favEl = document.getElementById("favoritesNavCount");
      if (favEl) favEl.textContent = String(loadFavoritesLength());
      const plEl = document.getElementById("savedPlaylistsNavCount");
      if (plEl) plEl.textContent = String(loadSavedPlaylistsLength());
    }

    updateNavCounts();
    window.addEventListener("storage", (e) => {
      if (e.key === FAVORITES_STORAGE_KEY || e.key === PLAYLISTS_STORAGE_KEY) {
        updateNavCounts();
      }
    });

    const statusEl = document.getElementById("linkStatus");
    const linkBtn = document.getElementById("linkBtn");
    const unlinkBtn = document.getElementById("unlinkBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    function setStatus(text, { error = false } = {}) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", Boolean(error));
    }

    async function refreshStatus() {
      setStatus(t("status.checking"));
      try {
        const r = await fetch("/api/account/status", { credentials: "include" });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          setStatus(data && data.detail ? String(data.detail) : t("status.couldNotLoad"), { error: true });
          unlinkBtn.hidden = true;
          return;
        }
        if (data && data.linked) {
          setStatus(t("status.linked"));
          unlinkBtn.hidden = false;
        } else {
          setStatus(t("status.notLinked"));
          unlinkBtn.hidden = true;
        }
      } catch (e) {
        setStatus(t("status.networkError", { error: e }), { error: true });
        unlinkBtn.hidden = true;
      }
    }

    linkBtn.addEventListener("click", () => {
      window.location.href = "/auth/google/start";
    });

    unlinkBtn.addEventListener("click", async () => {
      if (!confirm(t("confirm.unlink"))) return;
      setStatus(t("status.unlinking"));
      try {
        const r = await fetch("/auth/google/unlink", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({}),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          setStatus(data && data.detail ? String(data.detail) : t("status.unlinkFailed"), { error: true });
          return;
        }
        await refreshStatus();
      } catch (e) {
        setStatus(t("status.networkError", { error: e }), { error: true });
      }
    });

    refreshBtn.addEventListener("click", refreshStatus);
    document.getElementById("langEn").addEventListener("click", () => switchLanguage("en"));
    document.getElementById("langEs").addEventListener("click", () => switchLanguage("es"));
    switchLanguage(localStorage.getItem(LANGUAGE_STORAGE_KEY) === "es" ? "es" : "en");
    refreshStatus();
  </script>
</body>
</html>
