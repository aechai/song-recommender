<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved playlists — Song Recommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff5f7;
      --bg-elevated: rgba(255, 255, 255, 0.42);
      --border: rgba(255, 255, 255, 0.68);
      --text: #4c3b44;
      --muted: #8f7784;
      --accent: #c79b6b;
      --accent-soft: #d8b89b;
      --accent-dim: rgba(199, 155, 107, 0.2);
      --danger: #d47386;
      --radius: 24px;
      --shadow: 0 22px 42px rgba(181, 139, 158, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Montserrat", system-ui, sans-serif;
      background:
        radial-gradient(1000px 700px at -8% -12%, #fce4ec 0%, rgba(252, 228, 236, 0.15) 62%, transparent 100%),
        radial-gradient(920px 620px at 108% -4%, #f3e5f5 0%, rgba(243, 229, 245, 0.14) 60%, transparent 100%),
        radial-gradient(900px 500px at 50% 112%, #fff5f7 0%, rgba(255, 245, 247, 0.8) 58%, transparent 100%),
        linear-gradient(145deg, #fff8f3 0%, #fff5f7 45%, #f9eef7 100%);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    header {
      margin-bottom: 2rem;
    }
    .header-top { display: flex; justify-content: flex-end; margin-bottom: 0.9rem; }
    .lang-toggle { display: inline-flex; gap: 0.25rem; background: rgba(255, 255, 255, 0.48); border: 1px solid rgba(255, 255, 255, 0.72); border-radius: 999px; padding: 0.22rem; box-shadow: 0 10px 20px rgba(181, 139, 158, 0.14); backdrop-filter: blur(10px); }
    .lang-btn { appearance: none; border: 0; background: transparent; color: var(--muted); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; padding: 0.32rem 0.65rem; border-radius: 999px; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.is-active { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-soft)); box-shadow: 0 8px 14px rgba(199, 155, 107, 0.35); }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      border: 1px solid transparent;
      transition: color 0.18s, border-color 0.18s, background 0.18s, transform 0.18s;
    }

    .nav-link:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.46);
      transform: translateY(-1px);
    }

    .nav-link[aria-current="page"] {
      color: var(--text);
      border-color: rgba(199, 155, 107, 0.38);
      background: var(--accent-dim);
    }

    .nav-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      opacity: 0.9;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0 0 0.5rem;
      color: #6d4a58;
      text-shadow: 0 0 16px rgba(231, 185, 202, 0.45);
    }

    .sub {
      color: var(--muted);
      font-size: 1rem;
    }

    .panel {
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      backdrop-filter: blur(15px);
    }

    .list-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .list-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
    }

    .list-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
    }

    .empty {
      margin: 0;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .empty[hidden] {
      display: none;
    }

    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .saved-pl {
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 22px;
      padding: 1rem 1.1rem;
      backdrop-filter: blur(15px);
    }

    .saved-pl-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.65rem;
    }

    .saved-pl-name {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .saved-pl-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0.25rem 0 0;
    }

    .saved-pl-prompt {
      font-size: 0.82rem;
      color: #806976;
      margin: 0.65rem 0 0;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.7);
      line-height: 1.45;
    }

    .saved-pl-prompt[hidden] {
      display: none;
    }

    .saved-pl-tracks {
      margin: 0.75rem 0 0;
      padding-left: 1.1rem;
      font-size: 0.88rem;
      color: var(--text);
    }

    .saved-pl-tracks li {
      margin: 0.35rem 0;
    }

    .btn-delete {
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(212, 115, 134, 0.45);
      background: rgba(255, 255, 255, 0.4);
      color: var(--danger);
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: rgba(212, 115, 134, 0.14);
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-link,
      .btn-delete {
        transition: none;
      }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      width: min(720px, calc(100vw - 2rem));
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 0.95rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 18px 36px rgba(181, 139, 158, 0.2);
      backdrop-filter: blur(10px);
      z-index: 999;
    }

    .toast.show {
      display: flex;
    }

    .toast.error {
      border-color: rgba(248, 113, 113, 0.55);
    }

    .toast-text {
      font-size: 0.92rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toast-close {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: #8f7784;
      border-radius: 999px;
      width: 2.1rem;
      height: 2.1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .toast-close:hover {
      color: var(--text);
      border-color: rgba(199, 155, 107, 0.4);
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav" aria-label="Site">
      <a href="/" class="nav-link" data-i18n="nav.recommend">Recommend songs</a>
      <a href="/favorites" class="nav-link" data-i18n="nav.saved">Saved</a>
      <a href="/personality-quiz" class="nav-link" data-i18n="nav.quiz">Personality quiz</a>
      <a href="/account" class="nav-link" data-i18n="nav.account">Account</a>
    </nav>

    <header>
      <div class="header-top">
        <div class="lang-toggle" role="group" aria-label="Language selector">
          <button type="button" class="lang-btn is-active" id="langEn">EN</button>
          <button type="button" class="lang-btn" id="langEs">ES</button>
        </div>
      </div>
      <h1 data-i18n="header.title">Saved playlists</h1>
      <p class="sub" data-i18n="header.sub">Playlists you saved from the recommender. Stored only in this browser on this device.</p>
    </header>

    <section class="panel" aria-label="Saved playlists">
      <div class="list-header">
        <h2 class="list-title" data-i18n="list.title">Your playlists</h2>
        <span class="list-count" id="playlistListCount">0</span>
      </div>
      <p class="empty" id="playlistsEmpty" data-i18n="list.empty">No saved playlists yet. Get recommendations on the home page, then use Save playlist.</p>
      <div class="saved-list" id="playlistsRoot"></div>
    </section>
  </div>

  <div class="toast" id="statusToast" role="status" aria-live="polite">
    <span class="toast-text" id="statusText"></span>
    <button type="button" class="toast-close" id="statusToastClose" aria-label="Dismiss status" data-i18n-aria-label="toast.dismiss">×</button>
  </div>

  <script>
    const FAVORITES_STORAGE_KEY = "songRecommenderFavorites";
    const PLAYLISTS_STORAGE_KEY = "songRecommenderSavedPlaylists";
    const LANGUAGE_STORAGE_KEY = "songRecommenderLanguage";
    let currentLanguage = "en";
    const translations = {
      en: {
        "nav.recommend": "Recommend songs", "nav.saved": "Saved", "nav.quiz": "Personality quiz", "nav.account": "Account",
        "header.title": "Saved playlists", "header.sub": "Playlists you saved from the recommender. Stored only in this browser on this device.",
        "list.title": "Your playlists", "list.empty": "No saved playlists yet. Get recommendations on the home page, then use Save playlist.",
        "toast.dismiss": "Dismiss status", "status.deleted": "Playlist deleted.", "status.exportFailed": "Export failed.", "status.createdYT": "Created YouTube playlist ({{count}} added). Opening…",
        "status.noUrl": "Exported, but no playlist URL returned.", "status.exportFailedWithError": "Export failed: {{error}}", "meta.tracks": "{{count}} tracks", "meta.saved": " · saved {{when}}",
        "btn.export": "Export to YouTube", "btn.delete": "Delete", "aria.export": "Export playlist {{name}} to YouTube", "aria.delete": "Delete playlist {{name}}", "prompt.request": "Request: {{prompt}}", "untitled": "Untitled",
      },
      es: {
        "nav.recommend": "Recomendar canciones", "nav.saved": "Guardadas", "nav.quiz": "Quiz de personalidad", "nav.account": "Cuenta",
        "header.title": "Playlists guardadas", "header.sub": "Playlists que guardaste del recomendador. Solo se almacenan en este navegador y este dispositivo.",
        "list.title": "Tus playlists", "list.empty": "Aún no hay playlists guardadas. Obtén recomendaciones en la página principal y luego usa Guardar playlist.",
        "toast.dismiss": "Cerrar estado", "status.deleted": "Playlist eliminada.", "status.exportFailed": "La exportación falló.", "status.createdYT": "Playlist de YouTube creada ({{count}} añadidas). Abriendo…",
        "status.noUrl": "Exportada, pero no se recibió URL de playlist.", "status.exportFailedWithError": "La exportación falló: {{error}}", "meta.tracks": "{{count}} canciones", "meta.saved": " · guardada {{when}}",
        "btn.export": "Exportar a YouTube", "btn.delete": "Eliminar", "aria.export": "Exportar playlist {{name}} a YouTube", "aria.delete": "Eliminar playlist {{name}}", "prompt.request": "Solicitud: {{prompt}}", "untitled": "Sin título",
      },
    };
    function t(key, vars = {}) {
      const dict = translations[currentLanguage] || translations.en;
      const fallback = translations.en[key] || key;
      const template = dict[key] || fallback;
      return String(template).replace(/\{\{(\w+)\}\}/g, (_, n) => String(vars[n] ?? ""));
    }
    function switchLanguage(lang) {
      currentLanguage = lang === "es" ? "es" : "en";
      localStorage.setItem(LANGUAGE_STORAGE_KEY, currentLanguage);
      document.documentElement.lang = currentLanguage;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (key) el.textContent = t(key);
      });
      document.querySelectorAll("[data-i18n-aria-label]").forEach((el) => {
        const key = el.getAttribute("data-i18n-aria-label");
        if (key) el.setAttribute("aria-label", t(key));
      });
      document.getElementById("langEn")?.classList.toggle("is-active", currentLanguage === "en");
      document.getElementById("langEs")?.classList.toggle("is-active", currentLanguage === "es");
    }

    const playlistsEmptyEl = document.getElementById("playlistsEmpty");
    const playlistsRootEl = document.getElementById("playlistsRoot");
    const playlistListCountEl = document.getElementById("playlistListCount");
    const statusToastEl = document.getElementById("statusToast");
    const statusTextEl = document.getElementById("statusText");
    const statusToastCloseEl = document.getElementById("statusToastClose");

    let statusAutoHideTimer = null;

    function hideStatusToast() {
      if (statusAutoHideTimer) {
        clearTimeout(statusAutoHideTimer);
        statusAutoHideTimer = null;
      }
      if (statusToastEl) {
        statusToastEl.classList.remove("show", "error");
      }
    }

    function showStatus(msg, { error = false, sticky = false } = {}) {
      if (!statusToastEl || !statusTextEl) return;
      if (statusAutoHideTimer) {
        clearTimeout(statusAutoHideTimer);
        statusAutoHideTimer = null;
      }
      statusTextEl.textContent = String(msg || "");
      statusToastEl.classList.toggle("error", Boolean(error));
      statusToastEl.classList.add("show");
      if (!error && !sticky) {
        statusAutoHideTimer = setTimeout(hideStatusToast, 4200);
      }
    }

    if (statusToastCloseEl) {
      statusToastCloseEl.addEventListener("click", hideStatusToast);
    }

    function loadFavoritesLength() {
      try {
        const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
        if (!raw) return 0;
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr.length : 0;
      } catch {
        return 0;
      }
    }

    function loadSavedPlaylists() {
      try {
        const raw = localStorage.getItem(PLAYLISTS_STORAGE_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        return arr.filter(
          (p) =>
            p &&
            typeof p.id === "string" &&
            typeof p.name === "string" &&
            Array.isArray(p.tracks),
        );
      } catch {
        return [];
      }
    }

    function persistSavedPlaylists(arr) {
      try {
        localStorage.setItem(PLAYLISTS_STORAGE_KEY, JSON.stringify(arr));
      } catch (_) {}
    }

    function updateNavCounts() {
      const favNav = document.getElementById("favoritesNavCount");
      if (favNav) favNav.textContent = String(loadFavoritesLength());
      const list = loadSavedPlaylists();
      const plNav = document.getElementById("savedPlaylistsNavCount");
      if (plNav) plNav.textContent = String(list.length);
      if (playlistListCountEl) playlistListCountEl.textContent = String(list.length);
    }

    function formatSavedAt(iso) {
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "";
        return d.toLocaleString(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        });
      } catch {
        return "";
      }
    }

    function deletePlaylist(id) {
      const rest = loadSavedPlaylists().filter((p) => p.id !== id);
      persistSavedPlaylists(rest);
      render();
      showStatus(t("status.deleted"));
    }

    function playlistTitleDisplay(name) {
      const s = String(name || "").trim();
      if (!s) return { text: t("untitled"), title: "" };
      if (s.length <= 32) return { text: s, title: "" };
      return { text: `${s.slice(0, 30)}…`, title: s };
    }

    function render() {
      const list = loadSavedPlaylists();
      updateNavCounts();
      playlistsEmptyEl.hidden = list.length > 0;
      playlistsRootEl.innerHTML = "";

      list.forEach((pl) => {
        const article = document.createElement("article");
        article.className = "saved-pl";

        const head = document.createElement("div");
        head.className = "saved-pl-head";

        const left = document.createElement("div");
        const h3 = document.createElement("h3");
        h3.className = "saved-pl-name";
        const titleDisp = playlistTitleDisplay(pl.name);
        h3.textContent = titleDisp.text;
        if (titleDisp.title) h3.title = titleDisp.title;
        const meta = document.createElement("p");
        meta.className = "saved-pl-meta";
        const when = formatSavedAt(pl.savedAt);
        meta.textContent = `${t("meta.tracks", { count: pl.tracks.length })}${when ? t("meta.saved", { when }) : ""}`;
        left.appendChild(h3);
        left.appendChild(meta);

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "0.5rem";
        actions.style.flexWrap = "wrap";
        actions.style.alignItems = "center";

        const exportBtn = document.createElement("button");
        exportBtn.type = "button";
        exportBtn.className = "btn-delete";
        exportBtn.style.borderColor = "rgba(124, 92, 255, 0.35)";
        exportBtn.style.color = "var(--text)";
        exportBtn.textContent = t("btn.export");
        exportBtn.setAttribute("aria-label", t("aria.export", { name: pl.name }));
        exportBtn.addEventListener("click", async () => {
          exportBtn.disabled = true;
          try {
            const r = await fetch("/api/youtube/export", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({
                name: String(pl.name || "Song Recommender playlist"),
                tracks: Array.isArray(pl.tracks)
                  ? pl.tracks.map((t) => ({ title: String(t.title || ""), artist: String(t.artist || "") }))
                  : [],
              }),
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) {
              const msg = (data && data.detail) ? String(data.detail) : t("status.exportFailed");
              showStatus(msg, { error: true, sticky: true });
              if (r.status === 401) {
                window.location.href = "/account";
              }
              return;
            }
            if (data.playlistUrl) {
              showStatus(t("status.createdYT", { count: data.addedCount || 0 }));
              window.open(String(data.playlistUrl), "_blank", "noopener,noreferrer");
            } else {
              showStatus(t("status.noUrl"), { error: true, sticky: true });
            }
          } catch (e) {
            showStatus(t("status.exportFailedWithError", { error: e }), { error: true, sticky: true });
          } finally {
            exportBtn.disabled = false;
          }
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn-delete";
        del.textContent = t("btn.delete");
        del.setAttribute("aria-label", t("aria.delete", { name: pl.name }));
        del.addEventListener("click", () => deletePlaylist(pl.id));

        actions.appendChild(exportBtn);
        actions.appendChild(del);

        head.appendChild(left);
        head.appendChild(actions);
        article.appendChild(head);

        const prompt = String(pl.prompt || "").trim();
        const promptP = document.createElement("p");
        promptP.className = "saved-pl-prompt";
        if (prompt) {
          promptP.textContent = t("prompt.request", { prompt });
        } else {
          promptP.hidden = true;
        }
        article.appendChild(promptP);

        const ol = document.createElement("ol");
        ol.className = "saved-pl-tracks";
        pl.tracks.forEach((t) => {
          const li = document.createElement("li");
          const title = String(t.title || "—").trim();
          const artist = String(t.artist || "—").trim();
          li.appendChild(document.createTextNode(`${title} — ${artist}`));
          ol.appendChild(li);
        });
        article.appendChild(ol);
        playlistsRootEl.appendChild(article);
      });
    }

    render();
    document.getElementById("langEn").addEventListener("click", () => { switchLanguage("en"); render(); });
    document.getElementById("langEs").addEventListener("click", () => { switchLanguage("es"); render(); });
    switchLanguage(localStorage.getItem(LANGUAGE_STORAGE_KEY) === "es" ? "es" : "en");
    render();

    window.addEventListener("storage", (e) => {
      if (e.key === FAVORITES_STORAGE_KEY || e.key === PLAYLISTS_STORAGE_KEY) {
        render();
      }
    });
  </script>
</body>
</html>
